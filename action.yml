name: "Claude Code Review"
description: "Automated PR code review using Claude Code with inline comments and structured summary"
author: "vuluu2k"

branding:
  icon: "code"
  color: "purple"

inputs:
  claude_token:
    description: "Claude OAuth token (from `claude setup-token`)"
    required: true
  github_token:
    description: "GitHub token for PR operations"
    required: true
  pr_number:
    description: "PR number to review (auto-detected from event context if not provided)"
    required: false
    default: ""
  max_turns:
    description: "Maximum agentic turns for Claude"
    required: false
    default: "40"
  model:
    description: "Claude model to use"
    required: false
    default: "claude-opus-5"
  review_prompt:
    description: "Override the default review prompt. If empty, uses built-in prompts/review-pr.md"
    required: false
    default: ""
  extra_prompt:
    description: "Additional review instructions appended to the prompt (per-repo rules)"
    required: false
    default: ""
  skip_merged:
    description: "Skip the review when the PR is already merged or closed"
    required: false
    default: "true"
  dedup_similar_prs:
    description: "Skip a PR whose content was already reviewed in a twin PR (same hotfix opened against master and develop)"
    required: false
    default: "true"
  incremental_review:
    description: "On re-runs, review only the commits pushed since the previous review"
    required: false
    default: "true"
  max_incremental_bytes:
    description: "Fall back to a full review when the incremental patch exceeds this size"
    required: false
    default: "300000"
  force:
    description: "Bypass every guard and review the whole PR again"
    required: false
    default: "false"

outputs:
  total_cost_usd:
    description: "Total cost in USD"
    value: ${{ steps.review.outputs.cost }}
  num_turns:
    description: "Number of agentic turns used"
    value: ${{ steps.review.outputs.turns }}
  session_id:
    description: "Claude session ID (for resuming)"
    value: ${{ steps.review.outputs.session }}
  skipped:
    description: "true when the guard skipped the review"
    value: ${{ steps.guard.outputs.skip }}
  skip_reason:
    description: "Why the review was skipped (empty when it ran)"
    value: ${{ steps.guard.outputs.skip_reason }}
  review_mode:
    description: "full or incremental"
    value: ${{ steps.guard.outputs.mode }}

runs:
  using: "composite"
  steps:
    - name: Add eyes reaction to trigger comment
      if: github.event_name == 'issue_comment'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
          --method POST -f content=eyes || true

    - name: Determine PR number
      id: pr
      shell: bash
      run: |
        if [ -n "${{ inputs.pr_number }}" ]; then
          echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event_name }}" = "issue_comment" ]; then
          echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Cannot determine PR number. Provide pr_number input."
          exit 1
        fi

    # Guard: merged/draft/bot PR, duplicate twin PR (hotfix opened against both
    # master and develop), and incremental scoping. See scripts/review-guard.sh.
    - name: Review guard
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ steps.pr.outputs.number }}
        SKIP_MERGED: ${{ inputs.skip_merged }}
        DEDUP_SIMILAR_PRS: ${{ inputs.dedup_similar_prs }}
        INCREMENTAL_REVIEW: ${{ inputs.incremental_review }}
        MAX_INCREMENTAL_BYTES: ${{ inputs.max_incremental_bytes }}
        FORCE: ${{ inputs.force }}
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        # `/review full` (or `/review force`) in a PR comment bypasses every guard.
        if [ "${{ github.event_name }}" = "issue_comment" ] \
           && printf '%s' "$COMMENT_BODY" | grep -qiE '/review[[:space:]]+(full|force)'; then
          export FORCE=true
        fi
        bash "${{ github.action_path }}/scripts/review-guard.sh"

    - name: Report skip reason on comment trigger
      if: steps.guard.outputs.skip == 'true' && github.event_name == 'issue_comment'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh api -X POST "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments" --silent \
          -f body="🤖 Review skipped: ${{ steps.guard.outputs.skip_reason }}. Comment \`/review full\` to force a full re-review."

    - name: Checkout PR branch (for comment triggers)
      if: github.event_name == 'issue_comment' && steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: gh pr checkout ${{ steps.pr.outputs.number }}

    - name: Install Claude Code
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Setup Claude authentication
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      run: |
        mkdir -p ~/.claude
        cat > ~/.claude.json << 'AUTHEOF'
        {
          "hasCompletedOnboarding": true,
          "theme": "dark"
        }
        AUTHEOF

    # Pre-fetch PR diff + previous review comments in parallel so Claude
    # can Read them directly instead of spending agent turns on gh calls.
    - name: Pre-fetch PR context
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REPO: ${{ github.repository }}
        MODE: ${{ steps.guard.outputs.mode }}
      run: |
        # pr-meta.json was already written by the guard step.
        if [ "$MODE" = "incremental" ]; then
          # Replace the full diff with a pointer: the reviewed scope is incremental.patch.
          # A stub (rather than a missing file) stops the prompt's "fetch it yourself" fallback.
          printf '%s\n' "Full PR diff intentionally omitted — INCREMENTAL REVIEW MODE." \
            "Review scope is /tmp/pr-context/incremental.patch. Do not fetch the full diff." \
            > /tmp/pr-context/pr-diff.patch
        else
          gh pr diff "$PR_NUMBER" > /tmp/pr-context/pr-diff.patch &
        fi
        gh api "repos/$REPO/pulls/$PR_NUMBER/comments" \
          --jq '[.[] | {id, path, line, body, created_at, user: .user.login, in_reply_to_id}]' \
          > /tmp/pr-context/pr-comments.json &
        wait
        echo "Pre-fetched PR context (mode=${MODE}):"
        ls -la /tmp/pr-context/

    - name: Review PR
      id: review
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REPO: ${{ github.repository }}
        EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        INCREMENTAL_PROMPT: ${{ steps.guard.outputs.incremental_prompt }}
      run: |
        # Load review prompt: custom input > built-in default
        CUSTOM_PROMPT="${{ inputs.review_prompt }}"
        if [ -n "$CUSTOM_PROMPT" ]; then
          REVIEW_PROMPT="$CUSTOM_PROMPT"
        else
          PROMPT_FILE="${{ github.action_path }}/prompts/review-pr.md"
          if [ ! -f "$PROMPT_FILE" ]; then
            echo "::error::Review prompt not found at $PROMPT_FILE"
            exit 1
          fi
          REVIEW_PROMPT=$(cat "$PROMPT_FILE")
        fi

        claude -p "Review PR #${PR_NUMBER} in repository ${REPO}. Use gh CLI for all GitHub operations. The GH_TOKEN is already configured for bot identity (github-actions[bot]).

        Pre-fetched PR context is available in /tmp/pr-context/ (pr-meta.json, pr-diff.patch, pr-comments.json). Read these files in parallel BEFORE making any gh calls — they replace Step 2 and Step 2b fetches.

        ${REVIEW_PROMPT}

        ${EXTRA_PROMPT}

        ${INCREMENTAL_PROMPT}" \
          --model ${{ inputs.model }} \
          --allowedTools "Bash(gh *)" \
          --allowedTools "Bash(jq *)" \
          --allowedTools "Bash(cat *)" \
          --allowedTools "Bash(rm /tmp/*)" \
          --allowedTools "Write(//tmp/**)" \
          --allowedTools "Edit(//tmp/**)" \
          --allowedTools "Read" \
          --allowedTools "Grep" \
          --allowedTools "Glob" \
          --max-turns ${{ inputs.max_turns }} \
          --output-format json | tee /tmp/claude-review-output.json

        # Extract outputs
        echo "cost=$(jq -r '.total_cost_usd // "0"' /tmp/claude-review-output.json)" >> "$GITHUB_OUTPUT"
        echo "turns=$(jq -r '.num_turns // "0"' /tmp/claude-review-output.json)" >> "$GITHUB_OUTPUT"
        echo "session=$(jq -r '.session_id // ""' /tmp/claude-review-output.json)" >> "$GITHUB_OUTPUT"

    # Record how far this PR has been reviewed. The next run diffs from here, and a
    # twin PR (same hotfix against another base branch) reads it to skip a duplicate.
    - name: Record review state
      if: success() && steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        MODE: ${{ steps.guard.outputs.mode }}
        SINCE: ${{ steps.guard.outputs.since_sha }}
        NEW_COMMITS: ${{ steps.guard.outputs.new_commits }}
      run: |
        if [ "$MODE" = "incremental" ]; then
          NOTE="Mode: \`incremental\` (${NEW_COMMITS} new commit(s) since \`${SINCE:0:7}\`)."
        else
          NOTE="Mode: \`full\`."
        fi
        bash "${{ github.action_path }}/scripts/review-mark.sh" \
          "${{ steps.pr.outputs.number }}" \
          "${{ steps.guard.outputs.head_sha }}" \
          "${{ steps.guard.outputs.diff_fp }}" \
          "$NOTE"

    - name: Log token usage
      if: always() && steps.guard.outputs.skip != 'true'
      shell: bash
      run: |
        if [ -f /tmp/claude-review-output.json ]; then
          echo "## Claude Review Token Usage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"

          INPUT_TOKENS=$(jq -r '.usage.input_tokens // "N/A"' /tmp/claude-review-output.json)
          OUTPUT_TOKENS=$(jq -r '.usage.output_tokens // "N/A"' /tmp/claude-review-output.json)
          COST=$(jq -r '.total_cost_usd // "N/A"' /tmp/claude-review-output.json)
          TURNS=$(jq -r '.num_turns // "N/A"' /tmp/claude-review-output.json)
          SESSION=$(jq -r '.session_id // "N/A"' /tmp/claude-review-output.json)

          echo "| Input tokens | $INPUT_TOKENS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output tokens | $OUTPUT_TOKENS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total tokens | $(( ${INPUT_TOKENS:-0} + ${OUTPUT_TOKENS:-0} )) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cost (USD) | \$$COST |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Turns | $TURNS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Session ID | \`$SESSION\` |" >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=== Token Usage ==="
          echo "Input: $INPUT_TOKENS | Output: $OUTPUT_TOKENS | Cost: \$$COST | Turns: $TURNS"
        else
          echo "No review output found" >> "$GITHUB_STEP_SUMMARY"
        fi
